name: Build PDF

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Test.1.1
        uses: xu-cheng/latex-action@v3
        with:
          root_file: G3A/Test.1.1.tex

      - name: Compile Test.1.2
        uses: xu-cheng/latex-action@v3
        with:
          root_file: G3A/Test.1.2.tex

      - name: Create PDF directory
        run: |
          mkdir -p pdf/2026_27/G3A
          cp *.pdf pdf/2026_27/G3A/

      - name: Commit PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update PDFs"
