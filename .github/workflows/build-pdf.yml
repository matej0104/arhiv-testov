name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - "**/*.tex"
      - "**/*.sty"
      - "**/*.cls"
      - "**/metadata.json"
      - "scripts/**"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Prevedi vse, tudi ze aktualne PDF-je"
        type: boolean
        default: false
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Cela zgodovina, da je mogoc rebase pred objavo.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Namesto texlive-full (~5 GB, ~10 min) namestimo samo, kar potrebujemo.
      # Ce kateri paket manjka, ga dodaj v spodnji seznam.
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-pictures \
            texlive-science \
            texlive-lang-european \
            ghostscript

      - name: Compile all TEX files
        run: |
          python scripts/build_project.py ${{ (inputs.force && '--force') || '' }}

      - name: Generate index.json
        run: python scripts/generate_index.py

      # Objava z rebase in ponovnimi poskusi: med prevajanjem lahko WordPress
      # vticnik (ali ti sam) potisne nov commit in preprost push bi propadel
      # z "non-fast-forward".
      - name: Commit PDFs and index
        run: |
          set -u

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json || true

          pdf_dirs=$(find . -path ./.git -prune -o -type d -name pdf -print)
          if [ -n "$pdf_dirs" ]; then
            git add $pdf_dirs || true
          fi

          if git diff --cached --quiet; then
            echo "Ni sprememb za objavo."
            exit 0
          fi

          git commit -m "Auto update PDFs"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Objavljeno (poskus $attempt)."
              exit 0
            fi
            echo "Objava ni uspela (poskus $attempt), poskusim znova ..."
            sleep $((attempt * 5))
          done

          echo "Objava ni uspela niti po petih poskusih."
          exit 1

      # Obvesti WordPress vticnik, da so na voljo nove datoteke.
      # Nastavi repository secrets WP_WEBHOOK_URL in WP_WEBHOOK_SECRET (neobvezno).
      - name: Notify WordPress
        if: ${{ success() && env.WP_WEBHOOK_URL != '' }}
        env:
          WP_WEBHOOK_URL: ${{ secrets.WP_WEBHOOK_URL }}
          WP_WEBHOOK_SECRET: ${{ secrets.WP_WEBHOOK_SECRET }}
        run: |
          curl -sS -X POST "$WP_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Arhiv-Secret: $WP_WEBHOOK_SECRET" \
            -d "{\"event\":\"build-complete\",\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}" \
            || echo "Opozorilo: obvestilo WordPressu ni uspelo."
