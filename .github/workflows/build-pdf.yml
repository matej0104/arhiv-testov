name: Build PDF

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
     
      - name: Compile G3A Test
        uses: xu-cheng/latex-action@v3
        with:
          root_file: G3A/Test1.1.tex
          
       - name: Find PDFs
  run: |
    find . -name "*.pdf"
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: G3A/*.pdf
