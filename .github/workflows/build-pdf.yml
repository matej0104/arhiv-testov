name: Build PDF

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Test.1.1
        uses: xu-cheng/latex-action@v3
        with:
          root_file: G3A/Test.1.1.tex

      - name: Compile Test.1.2
        uses: xu-cheng/latex-action@v3
        with:
          root_file: G3A/Test.1.2.tex

      - name: List PDFs
        run: |
          find . -name "*.pdf"

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: "**/*.pdf"
