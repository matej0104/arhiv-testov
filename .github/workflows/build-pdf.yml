name: Build PDFs

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate index
        run: python generate_index.py

      - name: Show generated index
        run: cat index.json

      - name: Compile TEX files
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            Test.1.1.tex
            Test.1.2.tex
            Test.1.3.tex

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: "*.pdf"
