name: Sync Overleaf

on:
  schedule:
    # Dvakrat na delovni dan (06:00 in 15:00 po nasem casu = 04:00 in 13:00 UTC).
    # POZOR: pri zasebnem repozitoriju se minute Actions stejejo v brezplacno
    # kvoto 2000 min/mesec. Pogostejsi urnik (npr. */30) jo hitro porabi.
    # Ce urnika ne potrebujes, celoten blok "schedule" mirno zbrisi -
    # gumb "Sinhroniziraj" v WordPressu deluje neodvisno od njega.
    - cron: "0 4,13 * * 1-5"
  workflow_dispatch:
  # WordPress vticnik sprozi z: POST /repos/<owner>/<repo>/dispatches
  # body: {"event_type": "sync-overleaf"}
  repository_dispatch:
    types: [sync-overleaf]

permissions:
  contents: write

concurrency:
  group: sync-overleaf
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync projects from Overleaf
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: python scripts/sync_overleaf.py

      - name: Commit source files
        id: commit
        run: |
          set -u

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tex_dirs=$(find . -path ./.git -prune -o -type d -name tex -print)
          if [ -n "$tex_dirs" ]; then
            git add $tex_dirs || true
          fi

          meta=$(find . -path ./.git -prune -o -name metadata.json -print)
          if [ -n "$meta" ]; then
            git add $meta || true
          fi

          if git diff --cached --quiet; then
            echo "Iz Overleafa ni sprememb."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Sync from Overleaf"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Objavljeno (poskus $attempt)."
              exit 0
            fi
            echo "Objava ni uspela (poskus $attempt), poskusim znova ..."
            sleep $((attempt * 5))
          done

          exit 1

  build:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' }}
    uses: ./.github/workflows/build-pdf.yml
    secrets: inherit
